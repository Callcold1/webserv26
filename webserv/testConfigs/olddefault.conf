max_connections  1024;
max_header_size		 8000;
max_body_size	500000;
max_body_size		 1000000000;
keepalive_timeout  65;
read_write_timeout  200;
error_page	501 502 503 /50x.html;
charset	utf-8 iso-8859-1;
root /www/var;
method GET DELETE POST;
autoindex	t;

server {
	listen       8011;
	server_name  localhost;
	error_page	501 502 /50x.html;
	root default.conf;
	root server_root_2;

	max_body_size		 123454321;
	max_header_size		 1234;
	error_page	501 502 503 /50x.html;
	max_body_size	500000;
	charset	utf-8 iso-8859-1;

	charset utf-8;

	location / {
		root   html;
		index  index.html index.htm;
	}

	error_page  404              /404.html;

	error_page   500 502 503 504  /50x.html;
	location = /50x.html {
		root   html;
	}

	location = \.php$ {
		cgi_path .php /var/www;
		}
	}

