# CONFIG KEYWORDS

# 	GLOBAL
# 	======

#   Variable names
#   ==============
# 	autoindex;			indicates global autoindex setting (true = on, false = off)
# 	charset;			charset(s) that can be handled
# 	error_pages;		Map of error pages to generate
# 	index;				ordered list of possible index filenames - first one that works is returned
# 	max_body;			Max acceptable body size in bytes
# 	max_connections; 	Max connections to all servers
# 	max_header_size;	Max acceptable header size in bytes
# 	method;	    		list of method
# 	root_dir;			Root directory at global level
# 	servers;			Vector of servers
# 	timeout_ka;			Length of time before keep-alive timeout (seconds)
# 	timeout_rw;			Length of time before rw timeout (seconds)

# 	Directive Keyword	Args		Multi Allowed	Type					Duplicate Behavior	Inherited				Context(s)
# 	=================	====		=============	====					==================	=========				==========
# 	autoindex			1			no				bool					Overwrite			Replace if redefined	Global/CServer/CLocation
# 	charset				multi		yes				vector<string>			Append				Replace if redefined	Global/CServer/CLocation
# 	error_page			multi		yes				vector<errorPage_s>		Append 				Merge					Global/CServer/CLocation
# 	index				multi		yes				std::vector<string>		Append				Replace if redefined	Global/CServer/Location
# 	max_body_size		1			no				long long				Overwrite			Replace if redefined	Global/CServer/CLocation
# 	max_connections		1			no				int						Overwrite			n/a						Global only
# 	max_header_size		1			no				long long				Overwrite			Replace if redefined	Global/CServer
# 	method				multi		yes				vector<string>			Append				Replace if redefined	Global/CServer/CLocation
# 	root				1			no				std::string				Overwrite			Replace if redefined	Global/CServer/CLocation
# 	server				block		yes				vector<CServer>			Append				n/a						Global only
# 	keepalive_timeout	1			no				int						Overwrite			Replace if redefined	Global/CServer
# 	read_write_timeout	1			no				int						Overwrite			Replace if redefined	Global/CServer


#	SERVER
#	======
#	autoindex;			indicates server autoindex setting (true = on, false = off)		
#	charset;			charset(s) that can be handled	
#	error_pages;		Vector of error_page structs	
#	index;				ordered list of possible index filenames - first one that works is returned		
#	locations;			Vector of location class objects		
#	max_body;			Max acceptable body size in bytes
#	max_header_size;	Max acceptable header size in bytes
#	method;		    	Method permitted for all locations on server (can be superceded by location_method)
#	ports;				Connection info (port/ip/default_flag)	
#	root_dir;			Root directory for server - overrides global value
#	server_names;		Server names
#	timeout_ka;			Length of time before keep-alive timeout (seconds)
#	timeout_rw;			Length of time before rw timeout (seconds)
#	
#	Directive Keyword	Args		Multi Allowed	Type				Duplicate Behavior	Inherited from Global	Inherited to Location	Context(s)
#	=================	====		=============	====				==================	=====================	=====================	===========
#	autoindex			1			no				bool				Overwrite			Replace if redefined	Replace if redefined	Global/CServer/CLocation
#	charset				multi		yes				vector<string>		Append				Replace if redefined	Replace if redefined	Global/CServer/CLocation
#	error_page			multi		yes				vector<errorPage_s>	Append				Merge					Merge					Global/CServer/Location
#	index				multi		yes				std::vector<string>	Append				Replace if redefined	Replace if redefined	Global/CServer/Location
#	listen				multi		yes				vector<listen_s>	Append				No						No						CServer only
#	locations			block		yes				vector<Clocation>	Append				No						No						CServer only
#	max_body_size		1			no				long long			Overwrite			Replace if redefined	Replace if redefined	Global/CServer/CLocation
#	max_header_size		1			no				long long			Overwrite			Replace if redefined	Replace if redefined	Global/CServer
#	method				multi		yes				vector<string>		Append				Replace if redefined	Replace if redefined	Global/CServer/CLocation
#	root				1			no				std::string			Overwrite			Replace if redefined	Replace if redefined	Global/CServer/CLocation
#	server_names		multi		yes				vector<string>		Append				No						No						CServer only
#	keepalive_timeout	1			no				int					Overwrite			Replace if redefined	No						Global/CServer
#	read_write_timeout	1			no				int					Overwrite			Replace if redefined	No						Global/CServer


# 	LOCATION
# 	========

#   Variable names
#   ==============
# 	alias;				actual path for url
# 	autoindex;			indicates if the location has autoindex ()
# 	cgi_map;			cgi map (extension/path)
# 	charset;			charset(s) that can be handled
# 	error_pages;		Vector of error_page structs
# 	index;				ordered list of possible index filenames - first one that works is returned
# 	max_body;			Max acceptable body size in bytes
# 	method;			    method permitted for this locations on server (supercedes by global/server method)
# 	modifier;			need to add functionality - possibly use enum instead (Location = or Location ~ etc)
# 	redirect;			redirect_s url and redirect status
# 	root_dir;			root directory for location
# 	try_files;			files to serve + error code to return if no match found
# 	upload_path;		path to which files can be uploaded
# 	uri;				location uri
# 
# 	Directive Keyword	    Args		Multi Allowed	Type						Duplicate Behavior	Inherited				Context(s)						Notes
# 	=================	    ====		=============	====						==================	=========				===========						=====
# 
# 	alias				    1			no				string 						Overwrite			n/a						Location only					Overrides root
# 	autoindex			    1			no				bool						Overwrite			Replace if redefined	Global/CServer/CLocation
# 	cgi_path			    multi		yes				map<string, string>			Append				n/a						Location only
# 	charset				    multi		yes				vector<string>				Append				Replace if redefined	Global/CServer/CLocation
# 	error_page			    multi		yes				vector<errorPage_s>	Append	Merge				Merge					Global/CServer/Location
# 	index				    multi		yes				vector<string>				Append				Replace if redefined	Global/CServer/CLocation
# 	max_body_size		    1			no				long long					Overwrite			Replace if redefined	Global/CServer/CLocation
# 	method				    multi		yes				vector<string>				Append				Replace if redefined	Global/CServer/CLocation
# 	modifier (not keyword)	1			no				LocationMatchType_e			Overwrite			n/a						Location only
# 	redirect_status		    1			no				redirect_s					Overwrite			n/a						Location only					Combined into redirect_s
# 	redirect_url		    1			no				redirect_s					Overwrite			n/a						Location only					Combined into redirect_s
# 	root				    1			no				string						Overwrite			Replace if redefined	Global/CServer/CLocation
# 	try_files			    multi		yes				TryFiles_s					Overwrite			n/a						Location only
# 	upload_path			    1			no				string						Overwrite			n/a						Location only
# 	uri					    1			no				string						Overwrite			n/a						Location only

#     include       mime.types;
#     default_type  application/octet-stream;

	max_connections  1024;
	max_header_size		 8000;
	max_body_size	500000;
	max_body_size		 1000000000;
    keepalive_timeout  65;
    read_write_timeout  200;
	error_page	501 502 503 /50x.html;
	charset	utf-8 iso-8859-1;
	root /www/var;
	method GET DELETE POST;
	autoindex	t;

    server {
        listen       8080;
        server_name  localhost;
		error_page	400 404 501 502 /50x.html;
		root /www;

        location / {
            root   /www;
            index  index.html index.htm;
        }
        location /html {
            root   /www/html;
            index  index.html index.htm;
        }
        location /html/la {
            root   /www/html/lalala;
            index  index.html index.htm;
        }
        location /cgi {
            root   /www/cgi-bin;
            index  index.html index.htm;
        }
    }
