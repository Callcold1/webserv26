autoindex			t;
charset				utf-8 iso-8859-1;
error_page			501 502 503 /50x.html;
max_body_size		10000;
max_connections 	1024;
max_header_size 	8000;
method 				GET DELETE POST;
root				/www/var;
keepalive_timeout	65;
read_write_timeout	200;

server {
	charset			utf-8;
	listen			8080;
	server_name		server1;
	error_page		401 402 /40x.html;
	max_body_size	123454321;
	max_header_size	1234;
	root			html;

	   location / {
		   root		/www;
		   max_body_size	111111;
		   index	index.html index.htm;
	   }
		location /abc {
		   root		/www/abc;
		   max_body_size	222222;
		   index	index.html index.htm;
	   }
	   	location /abc/def {
		   root		/www/abc/def;
		   max_body_size	333333;	
		   index	index.html index.htm;
	   }
	   	location /abc/def/ghi {
		   root		/www/abc/def/ghi;
		   max_body_size	444444;
		   index	index.html index.htm;
	   }
}

server {
	listen			8081;
	server_name		example.com;
	error_page		401 402 /40x.html;
	max_body_size	123454321;
	max_header_size	1234;
	root			html;

	   location / {
		   root		abc;
		   index	index.html index.htm;
	   }
}

server {
	charset			utf-8;
	listen			8082;
	server_name		server2;
	error_page		401 402 /40x.html;
	max_body_size	123454321;
	max_header_size	1234;
	root			html;

	   location / {
		   root		abc;
		   index	index.html index.htm;
	   }
}

server {
	charset			utf-8;
	listen			127.0.0.1:8084;
	server_name		localhost;
	error_page		401 402 /40x.html;
	max_body_size	123454321;
	max_header_size	1234;
	root			html;

	   location / {
		   root		abc;
		   index	index.html index.htm;
	   }
	   location /test {
		   root		def;
		   index	index.html index.htm;
	   }
	   location /test/longer {
		   root		ghi;
		   index	index.html index.htm;
	   }
	   location /test/longer/still {
		   root		klm;
		   index	index.html index.htm;
	   }
	   location /test/longer/still/again {
		   root		nop;
		   index	index.html index.htm;
	   }
}
