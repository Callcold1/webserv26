# TEST CONFIG FOR SERVER MATCHING

# SCENARIO  : 3 servers with same listen ip:port
# 			: 3 different server names
# 			: Default server is not specified in config, so should be set to server1 during config parsing (If no suitable host match)

# TEST 1 : Confirm that the correct server is selected based on the server name in the request
# TEST 2 : Confirm that the default server is selected when no server name is provided in the request (HTTP 1.0)
# TEST 3 : Confirm error when no host header is provided in the request (1.1 ONLY)
# TEST 4 : Confirm error when host header but no host value (host :)
# TEST 5 : Confirm error when host header but no host value (host :)

# COMMAND : TEST 1 : curl -H "Host: server1" http://localhost:8080/
# OUTCOME : Should match server1 and return content from /www

# COMMAND : TEST 2 : curl --http1.0 http://localhost:8080/
# OUTCOME : No Host Header (HTTP 1.0) : Should match default server (server1) and return content from /www

# COMMAND : TEST 3 : curl --http1.0 http://localhost:8080/
# OUTCOME : No Host Header (HTTP 1.0) : Should match default server (server1) and return content from /www

# COMMAND : TEST 4 : curl -v --http1.1 -H "Host;" http://localhost:8080/
# OUTCOME : No Host Header Value (HTTP 1.1) : Should throw error as host header is mandatory

# COMMAND : TEST 5 : curl -H "Host: unknown" http://localhost:8080/
# OUTCOME : Should match default server (server1) and return content from /www

max_connections 	1024;
max_header_size 	8000;
method 				GET DELETE POST;
root				/www/var;

server {
	charset			utf-8;
	listen			8080;
	server_name		server1;

	location / {
	   root		/www;
	}
}

server {
	charset			utf-8;
	listen			8080;
	server_name		server2;

	location / {
	   root		/www;
	}
}

server {
	charset			utf-8;
	listen			8080;
	server_name		server3;

	location / {
	   root		/www;
	}
}
