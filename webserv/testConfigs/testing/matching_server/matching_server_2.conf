# TEST CONFIG FOR SERVER MATCHING

# SCENARIO  : 3 servers with same listen ip:port
# 			: 3 different server names
# 			: Default server is named (server block 2), so should be set to server2 during config parsing

# TEST 1 : Confirm that the default server is selected when no server name is provided in the request
# TEST 2 : Confirm that the default server is selected when no name match for hostname header in request

# COMMAND : TEST 1 : curl http://localhost:8080/
# OUTCOME : Should match default server (server2) and return content from /www

# COMMAND : TEST 2 : curl -H "Host: unknown" http://localhost:8080/	
# OUTCOME : Should match default server (server2) and return content from /www

max_connections 	1024;
max_header_size 	8000;
method 				GET DELETE POST;
root				/www/var;

server {
	charset			utf-8;
	listen			8080;
	server_name		server1;

	location / {
	   root		/www;
	}
}

server {
	charset			utf-8;
	listen			8080 default_server;
	server_name		server2;

	location / {
	   root		/www;
	}
}

server {
	charset			utf-8;
	listen			8080;
	server_name		server3;

	location / {
	   root		/www;
	}
}
