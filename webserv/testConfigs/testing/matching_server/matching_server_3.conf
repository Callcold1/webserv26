# TEST CONFIG FOR SERVER MATCHING

# SCENARIO  : 3 servers with same listen ip:port
# 			: 3 different server names
# 			: 2 blocks indicate they are Default server (server blocks 2 & 3) : should throw error

# TEST 1 : Confirm that error is thrown when config has 2 default_server nominated for same port 

# COMMAND : TEST 1 : curl http://localhost:8080/
# OUTCOME : Should match default server (server2) and return content from /www

max_connections 	1024;
max_header_size 	8000;
method 				GET DELETE POST;
root				/www/var;

server {
	charset			utf-8;
	listen			8080;
	server_name		server1;

	location / {
	   root		/www;
	}
}

server {
	charset			utf-8;
	listen			8080 default_server;
	server_name		server2;

	location / {
	   root		/www;
	}
}

server {
	charset			utf-8;
	listen			8080 default_server;
	server_name		server3;

	location / {
	   root		/www;
	}
}
