# CONFIG KEYWORDS

# GLOBAL
# ======
# "charsets"
# "error_page"
# "max_body_size"
# "max_connections"
# "max_header_size"
# "keepalive_timeout"
# "read_write_timeout"

#	Directive			Args		Multi Allowed	Duplicate Behavior	Inherited	Notes
#	=========			====		=============	==================	=========	=====
#	
#	server				block		yes				Append				No			No
#	
#	charsets			multi		yes				Append				Replace		Replace if redefined
#	error_page			multi		yes				Append 				Merge		Error code is key - if duplicate keys, path is overwritten
#	
#	max_body			1			no				Overwrite			Replace
#	max_header_size		1			no				Overwrite			Replace
#	
#	max_connections		1			no				Overwrite			Replace		Global only
#	timeout_ka			1			no				Overwrite			Replace
#	timeout_rw			1			no				Overwrite			Replace

# SERVER
# ======
# "charsets"				// charset(s) that can be handled
# "error_page"				// Vector of error_page structs
# "listen"					// Vector of location class objects
# "max_body_size"			// Max acceptable body size in bytes
# "max_connections"			// Max acceptable header size in bytes
# "max_header_size"			// Methods permitted for all locations on server (can be superceded by location_methods)
# "methods"					// Connection info (port/ip/default_flag)
# "root"					// Root directory for server - overrides global value
# "server_name"				// Server name

#	Directive			Args		Multi Allowed	Duplicate Behavior	Inherited from Global	Inherited to Location	Notes
#	=========			====		=============	==================	=====================	=====================	=====
#	locations			block		yes				Append				No						No
#	
#	charsets			multi		yes				Append				Replace					Replace
#	error_page			multi		yes				Append				Merge					Merge
#	listen				multi		yes				Append				No						No						
#	methods				multi		yes				Append				Replace					Replace
#	server_name			multi		yes				Append				No						No
#	
#	max_body			1			no				Overwrite			Replace					Replace
#	max_header_size		1			no				Overwrite			Replace					Replace
#	
#	root				1			no				std::string			Overwrite				Replace					

# LOCATION
# ========
# "alias"
# "autoindex"
# "cgi_path"
# "charsets"
# "index"
# "methods"
# "redirect_status"
# "redirect_path"
# "root"
# "upload_path"

#	Directive			Args		Multi Allowed	Duplicate Behavior	Inherited	Notes
#	=========			====		=============	==================	=========	=====
#	
#	cgi_path			multi		yes				Append (by ext)		Merge
#	charsets			multi		yes				Append				Replace
#	index				multi		yes				Append				Replace
#	methods				multi		yes				Append				Replace
#	try_files			multi		yes				Overwrite			No
#	
#	alias				1			no				Overwrite			No			Overrides root
#	autoindex			1			no				Overwrite			Replace		
#	modifier			1			no				Overwrite			No			
#	redirect_status		1			no				Overwrite			No			
#	redirect_url		1			no				Overwrite			No			
#	root				1			no				Overwrite			Replace
#	upload_path			1			no				Overwrite			Replace
#	uri					1			no				Overwrite			No

#     include       mime.types;
#     default_type  application/octet-stream;

	max_connections  1024;
	max_header_size		 8000;
	max_body_size		 1000000000;
    keepalive_timeout  65;
    read_write_timeout  200;
	error_page	501 502 503 /50x.html;
	max_body_size	500000;
	charsets	utf-8 iso-8859-1;

    server {
        listen       8011;
        server_name  localhost;
		error_page	501 502 /50x.html;
		root default.conf;
		root server_root_2;

		max_body_size		 123454321;
		max_header_size		 1234;
		error_page	501 502 503 /50x.html;
		max_body_size	500000;
		charsets	utf-8 iso-8859-1;

        charsets koi8-r;

        location / {
            root   html;
            index  index.html index.htm;
        }

        error_page  404              /404.html;

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        location = \.php$ {
            cgi_path  /var/www .php ;
        }

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

    }

    server {
        listen       8000;
        listen     127.0.0.1:8081 ;
        listen     localhost:8082;
        server_name  somename  alias  another.alias;

        location / {
            root   html;
            index  index.html index.htm;
        }
    }

    server {
        listen       443;
        server_name  localhost;

        location / {
            root   html;
            index  index.html index.htm;
        }
    }

# }


    server {
        listen     80;
        listen     192.0.0.1:81;
        listen     localhost:82;

       }

	server {
	    listen     7000;
	    listen     137.0.0.1:8081;
	    listen     localhost:8082;
    }
		 
	server {
        listen       8000;
        listen     127.0.0.1:8081;
        listen     localhost:8082;
}