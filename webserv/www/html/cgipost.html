<!doctype html>
	<html>
		<head>
			<title>The best website in existence!</title>
		</head>
		<body>
			<h1>The best website in existence!</h1>
			<h2>First, let's say hello to our website! (php cgi test)</h2>
			<p>What's your name?</p>
			<form action="/cgi-bin/php/say_hello.php" method="POST">
				<input type="text" name="firstname">
				<button type="submit">Say Hello</button>
			</form>
			<p></p>
			<h2>Meme generator (python cgi test)</h2>
			<img src="/assets/officememe.png" alt="could not find the office meme template" style="width:400px;height:500px;">
			<form action="/cgi-bin/python/meme.py" method="POST">
				<div>
					<label for="jimtext">Jim(left):</label><br>
					<input type="text" id="jimtext" name="jimtext" maxlength="200" size="50"><br>
					<label for="dwighttext">dwight(middle):</label><br>
					<input type="text" id="dwighttext" name="dwighttext" maxlength="200" size="50"><br>
					<label for="michaeltext">michael(right):</label><br>
					<input type="text" id="michaeltext" name="michaeltext" maxlength="200" size="50"><br>
					<button type="submit">submit</button>
				</div> 
			</form>
			<p></p>
			<h2>Upload a picture to our Gallery!</h2>
			<input type="file" id="fileInput" accept=".png" />
				<button onclick="upload()">Upload</button>

				<script>
				async function upload() {
				  const file = document.getElementById('fileInput').files[0];
				
				  await fetch('/upload', {
				    method: 'POST',
				    headers: {
				      'Content-Type': 'image/png'
				    },
				    body: file
				  });
				}
				</script>
				<div>
					<p>Accepted file type: .png</p>
				</div>
				<div>
					<button type="submit">Upload</button>
				</div>
			</form>
			<form action="/photos" method="GET">
				<div>
					<button type="submit">View Gallery</button>
				</div> 
			</form>
		</body>
	</html>
