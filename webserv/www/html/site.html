<!doctype html>
	<html>
		<head>
			<title>The best website in existence!</title>
		</head>
		<body>
			<h1>The best website in existence!</h1>
			<h2>Meme generator</h2>
			<img src="/assets/officememe.png" alt="could not find the office meme template" style="width:400px;height:500px;">
			<form action="/cgi-bin/meme.py" method="GET">
				<div>
					<label for="jimtext">Jim(left):</label><br>
					<input type="text" id="jimtext" name="jimtext" maxlength="200" size="50"><br>
					<label for="dwighttext">dwight(middle):</label><br>
					<input type="text" id="dwighttext" name="dwighttext" maxlength="200" size="50"><br>
					<label for="michaeltext">michael(right):</label><br>
					<input type="text" id="michaeltext" name="michaeltext" maxlength="200" size="50"><br>
					<button type="submit">submit</button>
				</div> 
			</form>
			<p></p>
			<h2>Submit File</h2>
			<form>
				<div>
					<input id="ImportFile"
						type="file"
						name="ImportFile"
						data-val="true"
						data-val-required="Please select a file"
						title="Browse for a picture to upload"
						accept=".png"/>
				</div>
				<div>
					<p>Accepted file type: .png</p>
				</div>
				<div>
					<button type="submit">Submit</button>
				</div>
			</form>
			<form action="/photos" method="GET">
				<div>
					<button type="submit">View Gallery</button>
				</div> 
			</form>
		</body>
	</html>
