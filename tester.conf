max_connections  1024;
max_header_size	8000;
max_body_size	104857601;
keepalive_timeout  65;
read_write_timeout  200;
charset	utf-8 iso-8859-1;
root /www;
method GET DELETE POST;
autoindex	f;

mime_types{
    text/html        html htm;
    text/css         css;
    application/javascript js;
    image/png        png;
    image/jpeg       jpg jpeg;
    image/gif        gif;
    image/x-icon     ico;
    text/plain       txt;
    application/pdf  pdf;
}

server {
    listen 8080;
    server_name localhost;
	cgi_path .bla /home/kmooney/Desktop/webserv26/webserv26/kev/webserv/cgi_tester;

    location / {
        method GET;
            root   /home/kmooney/Desktop/webserv26/webserv26/kev/webserv/www;

        index index.html index.htm;
    }

    location /post_body {
        method POST;
        root   /home/kmooney/Desktop/webserv26/webserv26/kev/webserv/www/upload;
        upload_path /home/kmooney/Desktop/webserv26/webserv26/kev/webserv/;
        max_body_size 100;
    }

    location /directory/ {
        method GET;
    	root   /home/kmooney/Desktop/webserv26/webserv26/kev/YoupiBanane/;
        index youpi.bad_extension;
        autoindex off;
    }
}

