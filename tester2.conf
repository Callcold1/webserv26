	max_connections  1024;
	max_header_size	8000;
    keepalive_timeout  65;
    read_write_timeout  200;
	charset	utf-8 iso-8859-1;
	root /www;
	method GET DELETE POST;
	autoindex	f;

    mime_types{
        text/html        html htm;
        text/css         css;
        application/javascript js;
        image/png        png;
        image/jpeg       jpg jpeg;
        image/gif        gif;
        image/x-icon     ico;
        text/plain       txt;
        application/pdf  pdf;
    }

server {
    listen 8080;
    server_name localhost;
    cgi_path /.../cgi_test .bla;

    location / {
        method GET;
        root /.../www;
        index index.html index.htm;
    }

    location /post_body {
        method POST;
        root /.../www/upload;
        max_body_size 100;
    }

    location /directory/ {
        method GET;
        root /.../YoupiBanane;
        index youpi.bad_extension;
    }

    # CGI handling (should NOT be limited to /cgi-bin)
}